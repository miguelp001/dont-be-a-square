<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Don't Be A Square" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Don't Be A Square" />
    <meta name="theme-color" content="#181028" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Cute & Highly Legible Rounded Game Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

    <title>Don't Be A Square</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html, body {
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #181028;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Arial', sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        height: 100dvh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        touch-action: none;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Hidden font preloader ensures glyphs are instantly available on canvas render -->
    <div style="font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 700; position: absolute; left: -9999px; top: -9999px; visibility: hidden;" aria-hidden="true">
      Don't Be A Square 0123456789 VICTORY DEFEAT PAUSED
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
